name: Build, test and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: docker build --pull -f Containerfile -t ubi-agent-base:check .
      - name: Test Herdr shell and Python environment
        run: docker run --rm --user exedev --entrypoint bash -v "$PWD/scripts/smoke.sh:/tmp/smoke.sh:ro" ubi-agent-base:check /tmp/smoke.sh
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/aditya-konarde/ubi-agent-base
        run: |
          docker tag ubi-agent-base:check "$IMAGE:latest"
          docker tag ubi-agent-base:check "$IMAGE:sha-$GITHUB_SHA-run-$GITHUB_RUN_ID"
          docker push "$IMAGE:sha-$GITHUB_SHA-run-$GITHUB_RUN_ID"
          docker push "$IMAGE:latest"
